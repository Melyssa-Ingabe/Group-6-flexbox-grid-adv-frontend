<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 2 - Grid</title>
  <link rel="stylesheet" href="grid-style.css">
</head>

<body>

  <header class="site-header">
    <h1>My Website</h1>
  </header>

  <nav class="site-nav">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </nav>

  <main class="site-main">

    <section class="main-content">
      <h2>Main Content</h2>
      <p>
        This is the main content area. It takes 70% of the available
        width on desktop screens.
      </p>
    </section>

    <aside class="sidebar">
      <h2>Sidebar</h2>
      <p>
        This is the sidebar. It takes 30% of the available width
        on desktop screens.
      </p>
    </aside>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Website</p>
  </footer>

</body>
</html>
