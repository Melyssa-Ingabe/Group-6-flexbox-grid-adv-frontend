<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastering CSS Layouts: Level 3 Advanced Challenge</title>

    <!-- ==========================================================================
         To switch between layouts, please comment/uncomment the links below
         using the VS Code shortcut (Ctrl + / or Cmd + /).
         ========================================================================== -->
    
    <!-- VERSION A: FLEXBOX LAYOUT -->
    <link rel="stylesheet" href="flexbox-style.css">

    <!-- VERSION B: CSS GRID LAYOUT -->
    <!-- <link rel="stylesheet" href="grid-style.css"> -->
</head>
<body>

    <header class="site-header">
        <h1>HEADER COMPONENT</h1>
    </header>

    <nav class="site-nav">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Core structural wrapper for content rows and sidebars -->
    <div class="layout-wrapper">
        <main class="main-content">
            <h2>Main Content Area</h2>
        </main>

        <aside class="sidebar sidebar-left">
            <h3>Left Sidebar</h3>
        </aside>

        <aside class="sidebar sidebar-right">
            <h3>Right Sidebar</h3>
        </aside>
    </div>

    <footer class="site-footer">
        <p>Footer Component</p>
    </footer>

</body>
</html>
